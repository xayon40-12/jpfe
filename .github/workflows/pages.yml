# Builds the web viewer and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    # Only when something the site is built from changes
    paths:
      - "src/**"
      - "viewer/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "jmdict.lock"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The dictionaries and font only change with the lindera version (in Cargo.lock), the pinned JMdict
      # release (jmdict.lock) or the scripts that prepare them
      - name: Restore dictionaries and font
        id: assets
        uses: actions/cache@v6
        with:
          path: viewer/assets
          key: web-assets-${{ hashFiles('Cargo.lock', 'jmdict.lock', 'scripts/*', 'viewer/build-web-assets.sh') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin
      - name: Prepare dictionaries and font
        if: steps.assets.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y zstd
          ./viewer/build-web-assets.sh
      - name: Build the web app
        working-directory: viewer
        run: trunk build --release
      - uses: actions/upload-pages-artifact@v5
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
