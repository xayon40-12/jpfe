[package]
name = "jpfe"
version = "0.1.0"
edition = "2021"
description = "Japanese Novel Word Frequency & Vocabulary Extractor"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lindera = { version = "6.2.0", features = ["embed-unidic"] }
epub = "2.1.6"
regex = "1.10"
csv = "1.3"
anyhow = "1.0"
lopdf = "0.42"
rayon = "1.10"
unicode-width = "0.2"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series"] }
