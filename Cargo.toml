[package]
name = "jpfe"
version = "0.1.0"
edition = "2021"
description = "Japanese Novel Word Frequency & Vocabulary Extractor"

[workspace]
members = [".", "viewer"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "jpfe"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Command-line tool: argument parsing, TSV/CSV export and the SVG chart
cli = ["embed-dict", "parallel", "dep:clap", "dep:plotters", "dep:csv", "dep:unicode-width"]
# Bake the UniDic dictionary into the binary (about 200 MB)
embed-dict = ["lindera/embed-unidic"]
# Extract PDF pages on several threads
parallel = ["dep:rayon", "lopdf/rayon"]
# Serialize chapters and word counts (the viewer caches them)
serde = ["dep:serde"]

[dependencies]
lindera = { version = "6.2.0", default-features = false }
lindera-dictionary = { version = "6.2.0", default-features = false }
epub = "2.1.6"
regex = "1.13"
anyhow = "1.0"
lopdf = { version = "0.47", default-features = false }
rayon = { version = "1.12", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
csv = { version = "1.4", optional = true }
unicode-width = { version = "0.2.3", optional = true }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series"], optional = true }
