[package]
name = "jpfe"
version = "0.1.0"
edition = "2021"
description = "Japanese Novel Word Frequency & Vocabulary Extractor"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lindera = { version = "6.2.0", features = ["embed-unidic"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
anyhow = "1.0"
lopdf = "0.42"
rayon = "1.10"
unicode-width = "0.2"
