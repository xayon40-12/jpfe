<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jpfe · Japanese vocabulary statistics</title>
  <link data-trunk rel="rust" data-bin="jpfe-viewer" data-wasm-opt="s">
  <link data-trunk rel="copy-dir" href="assets">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    @media (prefers-color-scheme: dark) { html, body { background: #1e1e1e; } }
    canvas { display: block; width: 100%; height: 100%; position: relative;
             /* Long presses inspect the charts: no browser menu, magnifier or text selection */
             -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
    /* Visible until the app draws its first frame over it */
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #6e6e73; }
  </style>
</head>
<body>
  <div id="loading">Loading jpfe…</div>
  <canvas id="app"></canvas>
</body>
</html>
